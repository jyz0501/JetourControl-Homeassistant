name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Package & Upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from manifest
        id: version
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create zip
        run: |
          cd custom_components
          zip -r ../jetour.zip jetour -x '*__pycache__*' '*.pyc'

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} jetour.zip --clobber
